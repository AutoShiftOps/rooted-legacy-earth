version: "3.9"
services:
  neo4j:
    image: neo4j:5-community
    environment:
      - NEO4J_AUTH=neo4j/rootedlocaldev
      - NEO4J_PLUGINS=["apoc"]
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data

  backend:
    build: ../backend
    env_file: ../backend/.env
    environment:
      - NEO4J_URI=bolt://neo4j:7687
    ports:
      - "4000:4000"
    depends_on:
      - neo4j

  frontend:
    build: ../frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:4000
    depends_on:
      - backend

volumes:
  neo4j_data:
